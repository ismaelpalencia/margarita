name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  migraciones:
    name: Auditoría de migraciones
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Una migración que borra una columna no se deshace con un rollback de
      # código: corre contra la base antes de arrancar. Si es intencional, el
      # archivo lleva `-- revisado: <motivo>` en su primera línea.
      - name: Revisar migraciones destructivas
        run: node scripts/check-migrations.mjs

  verificar:
    name: Tipos, tests y build
    runs-on: ubuntu-latest

    env:
      # La suite unitaria no toca la base de datos, pero dos módulos importan
      # el cliente de Prisma y este exige la variable al cargarse. Con un valor
      # de relleno, la prueba compila y corre sin servidor de PostgreSQL.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar esquema de Prisma
        run: npx prisma validate

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build completo
        run: npm run build

  integracion:
    name: Integración (PostgreSQL real)
    runs-on: ubuntu-latest

    # Base de datos de verdad, desechable. Es lo que permite probar el camino
    # completo: webhook firmado -> cola -> worker -> mensaje guardado, cifrado
    # en reposo, campañas, resultados de gestión y sesiones.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: margarita
          POSTGRES_PASSWORD: margarita
          POSTGRES_DB: margarita
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://margarita:margarita@localhost:5432/margarita
      ENCRYPTION_KEY: clave-de-integracion-para-ci-1234567890
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      META_APP_SECRET: 0123456789abcdef0123456789abcdef
      NODE_ENV: production
      # Las pruebas destructivas (alta desde cero y restauración de respaldo)
      # necesitan una base vacía; en CI lo es.
      INTEGRATION_DESTRUCTIVE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm install --include=dev --no-audit --no-fund

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Aplicar migraciones en la base de pruebas
        run: npx prisma migrate deploy

      - name: Verificar tipos (incluidas las pruebas)
        run: npm run typecheck:all

      - name: Build
        run: npm run build

      - name: Pruebas de integración
        run: npm run test:integration

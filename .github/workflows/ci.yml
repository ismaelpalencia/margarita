name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verificar:
    name: Tipos, tests y build
    runs-on: ubuntu-latest

    # Los comandos de Prisma (validate, generate y el build) leen la
    # configuración de prisma.config.ts, que exige DATABASE_URL. Ninguno
    # se conecta a una base de datos, así que basta un valor de relleno:
    # no hace falta configurar secretos en GitHub.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar esquema de Prisma
        run: npx prisma validate

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build completo
        run: npm run build
